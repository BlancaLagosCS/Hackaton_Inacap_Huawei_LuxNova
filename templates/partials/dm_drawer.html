<div id="comunidad-tools" data-buscar-url="{% url 'core:buscar_usuarios_api' %}" data-conversaciones-url="{% url 'core:dm_conversaciones' %}" data-dm-hilo="{% url 'core:dm_hilo' 0 %}">{% csrf_token %}</div>
<div class="modal fade" id="buscarPersonas" tabindex="-1" aria-labelledby="buscarPersonasTitulo" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h2 class="modal-title h5" id="buscarPersonasTitulo">Encuentra a tu comunidad</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div class="modal-body"><label class="form-label" for="buscador-global">Nombre o @nickname</label><input id="buscador-global" type="search" class="form-control buscador-pildora" autocomplete="off" placeholder="Busca por nombre o @nickname" data-buscar-perfiles><div data-resultados-perfiles class="busqueda-resultados mt-3" aria-live="polite"></div></div></div></div></div>
<a class="dm-flotante" href="{% url 'core:mensajes' %}" data-dm-open aria-controls="dmDrawer" aria-label="Abrir mensajes directos"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-2 2V11.5a9.5 9.5 0 0 1 19 0Z"/><path d="M7 10h10M7 14h6"/></svg><span>Mensajes</span><span id="dm-no-leidos" class="badge rounded-pill" hidden>0</span></a>
<aside class="offcanvas offcanvas-end dm-drawer" role="dialog" hidden tabindex="-1" id="dmDrawer" aria-labelledby="dmTitulo"><div class="offcanvas-header border-bottom"><h2 class="offcanvas-title h5" id="dmTitulo">Mensajes · INACAP Smart</h2><button class="btn-close" type="button" data-dm-close aria-label="Cerrar mensajes"></button></div><div class="dm-cuerpo"><section class="dm-lateral" aria-label="Conversaciones"><label class="visually-hidden" for="dm-buscar">Buscar personas para conversar</label><input id="dm-buscar" class="form-control buscador-pildora m-2" type="search" placeholder="Nombre o @nickname" autocomplete="off"><div id="dm-resultados" class="busqueda-resultados" aria-live="polite"></div><div id="dm-conversaciones"></div></section><section class="dm-panel" aria-label="Hilo de mensajes"><header class="dm-hilo-header"><button id="dm-volver" class="btn btn-sm btn-outline-dark" type="button">Conversaciones</button><a id="dm-perfil" class="dm-contacto" href="#"><span id="dm-avatar"></span><span id="dm-nombre">Selecciona una conversación</span></a><a id="dm-ver-perfil" class="btn btn-sm btn-outline-dark" href="#" hidden>Ver perfil</a></header><section id="dm-avales" class="dm-avales" aria-label="Solicitudes de aval pendientes" hidden></section><div id="dm-mensajes" class="dm-mensajes" aria-label="Mensajes de la conversación"></div><p id="dm-estado" class="small px-3 mb-1" role="status"></p><form id="dm-enviar" class="dm-enviar"><label class="visually-hidden" for="dm-texto">Escribir mensaje</label><textarea id="dm-texto" rows="2" maxlength="5000" class="form-control" placeholder="Escribe un mensaje…" required disabled></textarea><button id="dm-enviar-boton" class="btn btn-primary" disabled>Enviar</button></form><p id="dm-canal-oficial" class="small px-3 pb-2" hidden>Canal oficial. Responde las solicitudes con Aceptar aval o Rechazar aval.</p></section></div></aside>
