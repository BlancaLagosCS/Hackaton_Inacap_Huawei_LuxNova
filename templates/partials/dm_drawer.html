<div id="comunidad-tools" data-buscar-url="{% url 'core:buscar_usuarios_api' %}" data-conversaciones-url="{% url 'core:dm_conversaciones' %}" data-dm-hilo="{% url 'core:dm_hilo' 0 %}">{% csrf_token %}</div>
<div class="modal fade" id="buscarPersonas" tabindex="-1" aria-labelledby="buscarPersonasTitulo" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h2 class="modal-title h5" id="buscarPersonasTitulo">Encuentra a tu comunidad</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div class="modal-body"><label class="form-label" for="buscador-global">Nombre o @nickname</label><input id="buscador-global" type="search" class="form-control buscador-pildora" autocomplete="off" placeholder="Busca por nombre o @nickname" data-buscar-perfiles><div data-resultados-perfiles class="busqueda-resultados mt-3" aria-live="polite"></div></div></div></div></div>
<button class="dm-flotante" type="button" data-bs-toggle="offcanvas" data-bs-target="#dmDrawer" aria-controls="dmDrawer" aria-label="Abrir mensajes directos"><i class="bi bi-chat-dots-fill fs-4" aria-hidden="true"></i><span id="dm-no-leidos" class="badge rounded-pill" hidden>0</span></button>
<aside class="offcanvas offcanvas-end dm-drawer" tabindex="-1" id="dmDrawer" aria-labelledby="dmTitulo"><div class="offcanvas-header border-bottom"><h2 class="offcanvas-title h5" id="dmTitulo">Mensajes · INACAP Smart</h2><button class="btn-close" type="button" data-bs-dismiss="offcanvas" aria-label="Cerrar mensajes"></button></div><div class="dm-cuerpo"><section class="dm-lateral" aria-label="Conversaciones"><label class="visually-hidden" for="dm-buscar">Buscar personas para conversar</label><input id="dm-buscar" class="form-control buscador-pildora m-2" type="search" placeholder="Nombre o @nickname" autocomplete="off"><div id="dm-resultados" class="busqueda-resultados" aria-live="polite"></div><div id="dm-conversaciones"></div></section><section class="dm-panel" aria-label="Hilo de mensajes"><header class="dm-hilo-header"><button id="dm-volver" class="btn btn-sm btn-outline-dark" type="button">Conversaciones</button><a id="dm-perfil" class="dm-contacto" href="#"><span id="dm-avatar"></span><span id="dm-nombre">Selecciona una conversación</span></a></header><div id="dm-mensajes" class="dm-mensajes" aria-label="Mensajes de la conversación"></div><p id="dm-estado" class="small px-3 mb-1" role="status"></p><form id="dm-enviar" class="dm-enviar"><label class="visually-hidden" for="dm-texto">Escribir mensaje</label><textarea id="dm-texto" rows="2" maxlength="5000" class="form-control" placeholder="Escribe un mensaje…" required disabled></textarea><button id="dm-enviar-boton" class="btn btn-primary" disabled>Enviar</button></form><p id="dm-canal-oficial" class="small px-3 pb-2" hidden>Canal oficial de notificaciones automáticas del sistema (no admite respuestas)</p></section></div></aside>
