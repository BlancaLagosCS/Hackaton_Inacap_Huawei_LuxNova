<div class="participacion-barras">{% for barra in barras %}<div class="mb-3"><div class="d-flex justify-content-between gap-2 small"><span>{{ barra.etiqueta }}</span><strong>{{ barra.total }}</strong></div><div class="participacion-pista" aria-hidden="true"><div class="participacion-barra" style="width: {{ barra.porcentaje }}%;"></div></div></div>{% empty %}<p class="small text-secondary">Sin participaciones registradas.</p>{% endfor %}</div>
