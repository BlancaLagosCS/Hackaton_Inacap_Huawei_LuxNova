<div class="col-md-6"><article class="card perfil-publicacion h-100">{% if publicacion.img_publ %}<img src="{{ publicacion.img_publ.url }}" alt="{{ publicacion.tit_publ|default:'Publicación del foro' }}" loading="lazy">{% endif %}<div class="p-4"><div class="d-flex justify-content-between gap-2 mb-2"><span class="badge category-badge">#{{ publicacion.get_etiq_publ_display }}</span><time class="small text-secondary">{{ publicacion.fech_publ|date:'d M Y' }}</time></div><h3 class="h5">{{ publicacion.tit_publ|default:'Compartiendo con mi sede' }}</h3><p>{{ publicacion.cont_publ|truncatechars:180 }}</p><a href="{% url 'core:foro' %}#publicacion-{{ publicacion.pk }}">Ver publicación y comentarios</a></div></article></div>
